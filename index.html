<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMI & Prepayment Planner</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <main class="container">
    <h1>EMI & Prepayment Planner</h1>
    <p class="subtitle">Calculate your monthly EMI and see how much interest you can save by prepaying.</p>

    <section class="card">
      <label for="amount">Loan amount (₹)</label>
      <input type="number" id="amount" value="1000000">

      <label for="rate">Annual interest rate (%)</label>
      <input type="number" id="rate" value="8.5" step="0.1">

      <label for="tenure">Tenure (years)</label>
      <input type="number" id="tenure" value="10">

      <label for="extra">Extra prepayment per month (₹, optional)</label>
      <input type="number" id="extra" value="0">

      <button id="calculate">Calculate</button>
    </section>

    <section id="results"></section>
  </main>
  <script src="script.js"></script>
</body>
</html>
